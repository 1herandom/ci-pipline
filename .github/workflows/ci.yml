name: CI

on:
  pull_request:
    branches:
      - manual-test

jobs:
  test:
    name: Run tests and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run Super-Linter
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: manual-test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
